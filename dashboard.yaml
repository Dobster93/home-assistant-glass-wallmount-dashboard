                    }
                    #keypad mwc-button {
                      height: 48px;
                      font-size: 23px;
                      border-radius: 16px;
                      background: rgba(255,255,255,.07);
                    }
    # Public version: account-specific 'visible' user restrictions removed.
  - type: custom:grid-layout
    theme: Dobber Glass Reference
    path: security
    title: Security
    icon: mdi:shield-home
    card_mod:
      style: |
        :host {
          --mush-card-primary-font-size: 13px;
          --mush-card-secondary-font-size: 11px;
          --mush-card-primary-line-height: 16px;
          --mush-card-secondary-line-height: 14px;
          --mush-spacing: 8px;
          --mush-control-height: 30px;
        }
    layout:
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 0.9fr)
      grid-template-rows: auto auto
      grid-template-areas: |
        "header header header"
        "left middle right"
      grid-gap: 10px
      margin: 6px 6px 92px 6px
      mediaquery:
        '(max-width: 1100px)':
          grid-template-columns: 1fr 1fr
          grid-template-areas: |
            "header header"
            "left middle"
            "right right"
        '(max-width: 700px)':
          grid-template-columns: 1fr
          grid-template-areas: |
            "header"
            "left"
            "middle"
            "right"
    background:
      opacity: 50
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image: /local/dashboard-background.png
    cards:
      - type: custom:button-card
        name: |
          [[[
            window.dobberHomeTimers = window.dobberHomeTimers || {};
            if (window.dobberHomeTimers['security']) {
              clearTimeout(window.dobberHomeTimers['security']);
            }
            window.dobberHomeTimers['security'] = setTimeout(() => {
              if (window.location.pathname.endsWith('/security')) {
                window.location.href = '/wallmount-tab/home';
              }
            }, 30000);
            return '';
          ]]]
        show_icon: false
        show_name: false
        styles:
          card:
            - display: none
      - type: custom:stack-in-card
