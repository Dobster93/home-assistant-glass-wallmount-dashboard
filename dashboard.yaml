                  [[[
                    return entity?.state ?? '--:--';
                  ]]]
                label: |
                  [[[
                    const d = new Date();
                    const dag = d.toLocaleDateString('nl-NL', { weekday: 'long' });
                    const datum = d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long' });
                    return dag.charAt(0).toUpperCase() + dag.slice(1) + ' ' + datum;
                  ]]]
                tap_action:
                  action: none
