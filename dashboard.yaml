# ============================================================
# Dobber Home - Public GitHub edition
# Home Assistant Wallmount Dashboard
# ============================================================
#
# This is the public/template version of the dashboard.
# Replace example entity IDs and placeholders with entities from
# your own Home Assistant installation before use.
#
# Public-version changes:
# - Home Assistant user IDs removed from view visibility rules
# - Local media-source background IDs replaced by /local path
# - Address/install-specific waste sensor IDs made generic
# - Unique P1 meter suffix removed
# - Personal calendar entity made generic
# - Spotify playlist IDs replaced by placeholders
#
# Expected local files:
#   /config/www/dashboard-background.png
#   /config/www/screensaver/foto1.jpg ... foto19.jpg
#
# ============================================================

title: Dobber Home
kiosk_mode:
  hide_header: true
  hide_sidebar: true
  hide_menubutton: true
  hide_overflow: true
views:
  - title: Home
    path: home
    icon: mdi:home
    type: custom:grid-layout
    theme: Dobber Glass Reference
    layout:
      grid-template-columns: minmax(285px, 0.82fr) minmax(545px, 1.50fr) minmax(315px, 0.82fr)
      grid-template-rows: auto
      grid-template-areas: |
        "left center right"
      grid-gap: 10px
      margin: 6px 6px 92px 6px
      mediaquery:
        '(max-width: 1450px)':
          grid-template-columns: minmax(270px, .84fr) minmax(500px, 1.38fr) minmax(285px, .78fr)
          grid-gap: 10px
          margin: 6px 6px 88px 6px
        '(max-width: 1200px)':
          grid-template-columns: minmax(230px, .8fr) minmax(520px, 1.5fr)
          grid-template-areas: |
            "left center"
            "right right"
        '(max-width: 760px)':
          grid-template-columns: 1fr
          grid-template-areas: |
            "left"
            "center"
            "right"
    background:
      opacity: 50
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image: /local/dashboard-background.png
    cards:
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: sensor.time
            triggers_update:
              - sensor.time
              - weather.forecast_thuis
            show_icon: false
            show_state: false
            show_name: true
            show_label: true
            name: |
              [[[
                return entity?.state || '--:--';
              ]]]
            label: |
              [[[
                const d = new Date();

                const dag = d.toLocaleDateString('nl-NL', {
                  weekday: 'long'
                });

                const datum = d.toLocaleDateString('nl-NL', {
                  day: 'numeric',
                  month: 'long',
                  year: 'numeric'
                });

                return `
                  <div class="datum-blok">
                    <span class="weekdag">${dag}</span>
                    <span class="datum">${datum}</span>
                  </div>
                `;
              ]]]
            custom_fields:
              weather: |
                [[[
                  const weather = states['weather.forecast_thuis'];
                  const condition = weather?.state || 'unknown';

                  const icons = {
                    'clear-night': '🌙',
                    'cloudy': '☁️',
                    'fog': '🌫️',
                    'hail': '🌨️',
                    'lightning': '⚡',
                    'lightning-rainy': '⛈️',
                    'partlycloudy': '🌤️',
                    'pouring': '🌧️',
                    'rainy': '🌦️',
                    'snowy': '❄️',
                    'snowy-rainy': '🌨️',
                    'sunny': '☀️',
                    'windy': '💨',
                    'windy-variant': '🌬️'
                  };

                  const icon = icons[condition] || '🌤️';

                  return `
                    <div class="weather-animation condition-${condition}">
                      ${icon}
                    </div>
                  `;
                ]]]
            tap_action:
              action: none
            styles:
              card:
                - min-height: 132px
                - padding: 12px 18px
                - border-radius: 20px
                - overflow: hidden
                - background: >-
                    linear-gradient(145deg, rgba(22,30,36,.60),
                    rgba(10,16,21,.45))
                - border: 1px solid rgba(255,255,255,.11)
                - box-shadow: >-
                    inset 0 1px 0 rgba(255,255,255,.05), 0 10px 30px
                    rgba(0,0,0,.22)
                - backdrop-filter: blur(18px)
                - -webkit-backdrop-filter: blur(18px)
              grid:
                - grid-template-areas: '"n weather" "l weather"'
                - grid-template-columns: 1fr 105px
                - grid-template-rows: 1fr min-content
              name:
                - justify-self: start
                - align-self: center
                - font-size: clamp(58px, 5.7vw, 96px)
                - line-height: 0.88
                - font-weight: 300
                - letter-spacing: -5px
                - color: '#f4f7f7'
                - text-shadow: 0 3px 18px rgba(0,0,0,.25)
              label:
                - justify-self: start
                - align-self: end
                - text-align: left
              custom_fields:
                weather:
                  - justify-self: center
                  - align-self: center
            extra_styles: |
              .datum-blok {
                display: flex;
                align-items: baseline;
                gap: 8px;
                line-height: 1;
                margin-top: 4px;
              }

              .weekdag {
                font-size: 21px;
                font-weight: 500;
                color: rgba(244,247,247,.95);
                text-transform: capitalize;
              }

              .datum {
                font-size: 16px;
                font-weight: 300;
                color: rgba(220,228,231,.63);
              }

              .weather-animation {
                width: 90px;
                height: 90px;
                display: flex;
                justify-content: center;
                align-items: center;
                font-size: 64px;
                filter: drop-shadow(0 7px 8px rgba(0,0,0,.28));
                animation: weatherFloat 4s ease-in-out infinite;
              }

              .condition-sunny {
                animation: sunFloat 5s ease-in-out infinite, sunGlow 3s ease-in-out infinite alternate;
              }

              .condition-cloudy,
              .condition-partlycloudy {
                animation: cloudMove 5s ease-in-out infinite;
              }

              .condition-rainy,
              .condition-pouring,
              .condition-lightning-rainy {
                animation: rainMove 2.3s ease-in-out infinite;
              }

              .condition-clear-night {
                animation: moonFloat 5s ease-in-out infinite;
              }

              @keyframes weatherFloat {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-5px); }
                100% { transform: translateY(0px); }
              }

              @keyframes sunFloat {
                0% { transform: translateY(0px) rotate(0deg); }
                50% { transform: translateY(-4px) rotate(5deg); }
                100% { transform: translateY(0px) rotate(0deg); }
              }

              @keyframes sunGlow {
                from { filter: drop-shadow(0 0 4px rgba(255,190,60,.25)); }
                to { filter: drop-shadow(0 0 14px rgba(255,190,60,.55)); }
              }

              @keyframes cloudMove {
                0% { transform: translateX(-3px); }
                50% { transform: translateX(4px) translateY(-2px); }
                100% { transform: translateX(-3px); }
              }

              @keyframes rainMove {
                0% { transform: translateY(-2px); }
                50% { transform: translateY(3px); }
                100% { transform: translateY(-2px); }
              }

              @keyframes moonFloat {
                0% { transform: translateY(0px) rotate(-2deg); }
                50% { transform: translateY(-6px) rotate(3deg); }
                100% { transform: translateY(0px) rotate(-2deg); }
              }
