                    - border: none
                    - box-shadow: none
                    - padding: 8px 4px 14px
                    - cursor: default
                  grid:
                    - grid-template-areas: '"i" "n" "l"'
                    - row-gap: 8px
                  icon:
                    - width: 42px
                    - color: |
                        [[[
                          return ['pending', 'triggered'].includes(entity?.state)
                            ? '#ff6b6b' : '#3d9aff';
                        ]]]
                  name:
                    - color: '#edf3fa'
                    - font-size: 22px
                    - font-weight: 600
                  label:
                    - color: rgba(205,215,228,.76)
                    - font-size: 13px
                    - white-space: normal
              - type: alarm-panel
                entity: alarm_control_panel.alarmo
                name: Woningbeveiliging
                states: []
                card_mod:
                  style: |
                    ha-card {
                      background: transparent !important;
                      border: none !important;
                      box-shadow: none !important;
                      color: #edf3fa;
                      --primary-text-color: #edf3fa;
                      --secondary-text-color: rgba(205,215,228,.76);
                      --mdc-text-field-fill-color: rgba(255,255,255,.07);
                      --mdc-text-field-ink-color: #edf3fa;
                      --mdc-text-field-label-ink-color: rgba(205,215,228,.76);
                    }
                    .keypad, #keypad {
                      max-width: 320px;
                      margin: 12px auto 0;
                    }
                    .keypad ha-control-button {
                      min-height: 48px;
                      font-size: 23px;
                      --control-button-border-radius: 16px;
                    }
                    #keypad mwc-button {
                      height: 48px;
                      font-size: 23px;
                      border-radius: 16px;
                      background: rgba(255,255,255,.07);
                    }
