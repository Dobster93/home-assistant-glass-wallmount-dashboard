                      min-height: 48px;
                      font-size: 23px;
                      --control-button-border-radius: 16px;
                    }
                    #keypad mwc-button {
                      height: 48px;
                      font-size: 23px;
                      border-radius: 16px;
                      background: rgba(255,255,255,.07);
