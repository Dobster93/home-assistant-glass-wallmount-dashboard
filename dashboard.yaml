                custom_fields:
                  cover: |
                    [[[
                      const a = entity?.attributes || {};
                      const source = `${a.source || ''}`.toLowerCase();
                      const title = `${a.media_title || ''}`.toLowerCase();
                      const channel = `${a.media_channel || ''}`.toLowerCase();
                      const combined = `${source} ${title} ${channel}`;
                      const ep =
                        a.entity_picture ||
                        a.media_image_url ||
                        a.media_image ||
                        a.image_url ||
                        a.picture ||
                        '';

                      const art = ep
                        ? (String(ep).startsWith('/') && typeof hass !== 'undefined'
                            ? hass.hassUrl(ep)
                            : ep)
                        : '';


                      const tvSource = String(a.source || '').trim().toLowerCase();
                      const tvTitle = String(a.media_title || '').trim().toLowerCase();
                      const tvApp = String(a.app_name || '').trim().toLowerCase();
                      const tvNames = /^(tv|televisie|television|hdmi(?:[ -]?[0-9]+)?(?:[ -]?(?:e?arc))?|e?arc|optical|optisch)$/;
                      const isTvInput = tvNames.test(tvSource) || /^(tv|televisie|television)$/.test(tvApp) ||
                        ((!tvSource || tvSource === 'unknown' || tvSource === 'unavailable') && /^(tv|televisie|television)$/.test(tvTitle));

                      const tile = (bg1, bg2, border, accent, big, small, sub) => `
                        <div style="width:64px;height:64px;border-radius:14px;border:1px solid ${border};background:radial-gradient(circle at 30% 25%, ${accent}, transparent 38%),linear-gradient(145deg, ${bg1}, ${bg2});display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden;">
                          <div style="font-size:21px;font-weight:800;color:white;line-height:1;margin-bottom:5px;">${big}</div>
                          <div style="font-size:11px;font-weight:700;color:white;line-height:1.1;text-align:center;">${small}</div>
                          <div style="margin-top:4px;font-size:7px;letter-spacing:1.2px;color:${border};font-weight:700;">${sub}</div>
                        </div>`;

                      const iconTile = (icon) => `<div style="width:64px;height:64px;box-sizing:border-box;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:linear-gradient(145deg,rgba(26,36,45,.98),rgba(10,17,24,.98));display:flex;align-items:center;justify-content:center;"><ha-icon icon="${icon}" style="--mdc-icon-size:38px;width:38px;height:38px;color:#e8b75d;"></ha-icon></div>`;
                      const renderImg = (src) => `<div style="position:relative;width:64px;height:64px;">${iconTile('mdi:music')}<img src="${src}" style="position:absolute;inset:0;width:64px;height:64px;border-radius:14px;object-fit:cover;display:block;" onerror="this.onerror=null;this.style.display='none'"></div>`;

                      if (isTvInput) return iconTile('mdi:television');
                      if (combined.includes('sterren')) return tile('rgba(7,22,40,.98)','rgba(2,10,18,.98)','rgba(232,183,93,.85)','rgba(232,183,93,.30)','✦','Sterren NL','LIVE RADIO');
                      if (combined.includes('qmusic')) return tile('rgba(38,8,10,.98)','rgba(20,5,6,.98)','rgba(239,83,80,.85)','rgba(239,83,80,.30)','Q','Qmusic','LIVE RADIO');
                      if (combined.includes('538')) return tile('rgba(40,20,0,.98)','rgba(18,10,0,.98)','rgba(255,152,0,.90)','rgba(255,152,0,.28)','538','Radio','LIVE RADIO');
                      if (combined.includes('sky')) return tile('rgba(4,20,44,.98)','rgba(2,10,20,.98)','rgba(61,154,255,.88)','rgba(61,154,255,.28)','☀','SkyRadio','LIVE RADIO');
                      if (combined.includes('slam')) return tile('rgba(22,4,38,.98)','rgba(10,2,18,.98)','rgba(168,107,255,.90)','rgba(168,107,255,.30)','⚡','SLAM!','LIVE RADIO');

                      if (art && (entity.state === 'playing' || entity.state === 'paused')) return renderImg(art);
                      return tile('rgba(26,32,38,.98)','rgba(12,16,22,.98)','rgba(255,255,255,.12)','rgba(255,255,255,.08)','♫','Woonkamer','SONOS');
                    ]]]
                  badge: |
                    [[[
                      const a = entity?.attributes || {};
                      const source = `${a.source || ''}`.toLowerCase();
                      const title = `${a.media_title || ''}`.toLowerCase();
                      const channel = `${a.media_channel || ''}`.toLowerCase();
                      const combined = `${source} ${title} ${channel}`;

                      const tvSource = String(a.source || '').trim().toLowerCase();
                      const tvTitle = String(a.media_title || '').trim().toLowerCase();
                      const tvApp = String(a.app_name || '').trim().toLowerCase();
                      const tvNames = /^(tv|televisie|television|hdmi(?:[ -]?[0-9]+)?(?:[ -]?(?:e?arc))?|e?arc|optical|optisch)$/;
                      const isTvInput = tvNames.test(tvSource) || /^(tv|televisie|television)$/.test(tvApp) ||
                        ((!tvSource || tvSource === 'unknown' || tvSource === 'unavailable') && /^(tv|televisie|television)$/.test(tvTitle));
                      let label = 'SONOS';
                      let bg = 'rgba(255,255,255,.08)';
                      let color = 'rgba(240,244,248,.88)';
                      if (isTvInput) {
                        label = 'TV'; bg = 'rgba(232,183,93,.16)'; color = '#e8b75d';
                      } else if (combined.includes('sterren') || combined.includes('qmusic') || combined.includes('538') || combined.includes('sky') || combined.includes('slam')) {
                        label = 'LIVE RADIO'; bg = 'rgba(232,183,93,.18)'; color = 'rgba(232,183,93,.96)';
                      } else if (entity.state === 'playing') {
                        label = 'SPOTIFY / SONOS'; bg = 'rgba(61,154,255,.16)'; color = 'rgba(61,154,255,.95)';
                      }
                      return `<div style="display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:999px;background:${bg};color:${color};font-size:9px;font-weight:700;letter-spacing:.9px;">${label}</div>`;
                    ]]]
                  title: |
                    [[[
                      const a = entity?.attributes || {};
                      const combined = `${a.source || ''} ${a.media_title || ''} ${a.media_channel || ''}`.toLowerCase();
                      if (combined.includes('sterren')) return 'STERREN NL';
                      if (combined.includes('qmusic')) return 'QMUSIC';
                      if (combined.includes('538')) return 'RADIO 538';
                      if (combined.includes('sky')) return 'SKYRADIO';
                      if (combined.includes('slam')) return 'SLAM!';
                      return a.media_title || 'Geen muziek actief';
                    ]]]
                  subtitle: |
                    [[[
                      const a = entity?.attributes || {};
                      const combined = `${a.source || ''} ${a.media_title || ''} ${a.media_channel || ''}`.toLowerCase();

                      const tvSource = String(a.source || '').trim().toLowerCase();
                      const tvTitle = String(a.media_title || '').trim().toLowerCase();
                      const tvApp = String(a.app_name || '').trim().toLowerCase();
                      const tvNames = /^(tv|televisie|television|hdmi(?:[ -]?[0-9]+)?(?:[ -]?(?:e?arc))?|e?arc|optical|optisch)$/;
                      const isTvInput = tvNames.test(tvSource) || /^(tv|televisie|television)$/.test(tvApp) ||
                        ((!tvSource || tvSource === 'unknown' || tvSource === 'unavailable') && /^(tv|televisie|television)$/.test(tvTitle));
                      if (isTvInput) return 'Televisie · Sonos woonkamer';
                      if (combined.includes('sterren')) return 'De mooiste Nederlandstalige hits';
                      if (combined.includes('qmusic')) return 'Q sounds better with you';
                      if (combined.includes('538')) return 'Hitradio van Nederland';
                      if (combined.includes('sky')) return 'The feel good station';
                      if (combined.includes('slam')) return 'The Beat of the Moment';
                      return a.media_artist || a.media_album_name || 'Spotify / Sonos woonkamer';
                    ]]]
                  status: |
                    [[[
                      if (entity.state === 'playing') return '<span style="color:#54d17a;font-size:12px;">●</span> Speelt nu';
                      if (entity.state === 'paused') return '<span style="color:#f1c15d;font-size:12px;">●</span> Gepauzeerd';
                      return '<span style="color:rgba(255,255,255,.40);font-size:12px;">●</span> Inactief';
                    ]]]
