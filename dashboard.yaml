          - type: custom:stack-in-card
            mode: vertical
            cards:
              - type: custom:stack-in-card
                mode: horizontal
                cards:
                  - type: custom:button-card
                    entity: weather.forecast_thuis
                    show_icon: true
                    show_state: false
                    show_name: true
                    show_label: true
                    name: |
                      [[[
                        const d = new Date();
                        return d
                          .toLocaleDateString('nl-NL', { weekday: 'short' })
                          .replace('.', '');
                      ]]]
                    label: |
                      [[[
                        const d = new Date();

                        return `
                          <span class="agenda-day">
                            ${d.toLocaleDateString('nl-NL', { day: '2-digit' })}
                          </span>
                          <span class="agenda-month">
                            ${d
                              .toLocaleDateString('nl-NL', { month: 'short' })
                              .replace('.', '')}
                          </span>
                        `;
                      ]]]
                    icon: |
