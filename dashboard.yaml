            - overscroll-behavior: none
            - touch-action: manipulation
            - z-index: 9999
            - background: black
            - display: |
                [[[
                  return entity.state === 'on' ? 'block' : 'none';
                ]]]
            - opacity: |
                [[[
                  return entity.state === 'on' ? '1' : '0';
                ]]]
            - pointer-events: |
                [[[
                  return entity.state === 'on' ? 'auto' : 'none';
                ]]]
            - transition: opacity 1.5s ease-in-out
            - will-change: opacity
          grid:
            - grid-template-areas: '"achtergrond"'
