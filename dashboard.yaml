      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr) minmax(0, 0.9fr)
      grid-template-rows: auto auto
      grid-template-areas: |
        "header header header"
        "left middle right"
      grid-gap: 10px
      margin: 6px 6px 92px 6px
      mediaquery:
        '(max-width: 1100px)':
          grid-template-columns: 1fr 1fr
          grid-template-areas: |
            "header header"
            "left middle"
            "right right"
        '(max-width: 700px)':
          grid-template-columns: 1fr
          grid-template-areas: |
            "header"
            "left"
            "middle"
            "right"
    background:
      opacity: 50
      alignment: center
      size: cover
      repeat: no-repeat
      attachment: fixed
      image: /local/dashboard-background.png
    cards:
      - type: custom:button-card
        name: |
          [[[
            window.dobberHomeTimers = window.dobberHomeTimers || {};

            if (window.dobberHomeTimers['muziek']) {
              clearTimeout(window.dobberHomeTimers['muziek']);
            }

            window.dobberHomeTimers['muziek'] = setTimeout(() => {
              const huidigPad = window.location.pathname;

              if (huidigPad.endsWith('/muziek')) {
                window.location.href = '/wallmount-tab/home';
              }
            }, 30000);

            return '';
          ]]]
        show_icon: false
        show_name: false
        tap_action:
          action: none
        hold_action:
          action: none
        styles:
          card:
            - display: none
      - type: custom:stack-in-card
        view_layout:
          grid-area: header
        mode: vertical
        cards:
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.time
                icon: mdi:clock-outline
                show_icon: true
                show_name: true
                show_label: true
                show_state: false
                name: |
                  [[[
                    return entity?.state ?? '--:--';
                  ]]]
                label: |
                  [[[
                    const datum = new Date();
                    const dag = datum.toLocaleDateString('nl-NL', { weekday: 'long' });
                    const datumTekst = datum.toLocaleDateString(
                      'nl-NL',
                      { day: 'numeric', month: 'long' }
                    );
                    return dag.charAt(0).toUpperCase() + dag.slice(1) + ' ' + datumTekst;
                  ]]]
                tap_action:
                  action: none
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - padding: 10px 14px
