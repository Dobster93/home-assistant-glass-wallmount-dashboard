                .title { font-size: 17px !important; font-weight: 500
                !important; letter-spacing:.2px; color: rgba(245,248,248,.92)
                !important; }
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                entity: sensor.afval_gft
                update_timer: 1min
                name: Groen
                icon: mdi:leaf
                show_state: false
                show_label: true
                show_icon: true
                variables:
                  afval: |
                    [[[
                      const raw = String(entity?.state ?? '').trim();
                      const leeg = { datum: null, dagen: null };

                      if (
                        !raw ||
                        ['unknown', 'unavailable', 'none', 'null'].includes(raw.toLowerCase())
                      ) {
                        return leeg;
                      }

                      let d;

                      // Volledige ISO timestamp
                      // Bijvoorbeeld:
                      // 2026-10-05T22:00:00+00:00
                      // wordt lokaal 06-10-2026 00:00
                      if (/^\d{4}-\d{1,2}-\d{1,2}T/.test(raw)) {
                        d = new Date(raw);
                      }

                      // Alleen datum: 2026-10-06
                      else if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(raw)) {
                        const m = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);

                        d = new Date(
                          Number(m[1]),
                          Number(m[2]) - 1,
                          Number(m[3])
                        );
                      }

                      // Nederlands formaat: 06-10-2026 of 06/10/2026
                      else if (/^\d{1,2}[-\/]\d{1,2}[-\/]\d{4}/.test(raw)) {
                        const m = raw.match(
                          /^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/
                        );

                        d = new Date(
                          Number(m[3]),
                          Number(m[2]) - 1,
                          Number(m[1])
                        );
                      }

                      // Overige geldige datumwaarde
                      else {
                        d = new Date(raw);
                      }

                      if (!d || Number.isNaN(d.getTime())) {
                        return leeg;
                      }

                      const now = new Date();

                      const sensorDag = Date.UTC(
                        d.getFullYear(),
                        d.getMonth(),
                        d.getDate()
                      );

                      const vandaag = Date.UTC(
                        now.getFullYear(),
                        now.getMonth(),
                        now.getDate()
                      );

                      const dagen = Math.round(
                        (sensorDag - vandaag) / 86400000
                      );

                      return {
                        datum: d.toLocaleDateString('nl-NL', {
                          day: '2-digit',
                          month: '2-digit',
                          year: 'numeric'
                        }),
                        dagen: dagen
                      };
                    ]]]
                label: |
                  [[[
                    const a = variables.afval;

                    if (a.dagen === null) {
                      return 'Geen datum';
                    }

                    let tekst;

                    if (a.dagen === -1) {
                      tekst = 'Gisteren';
                    } else if (a.dagen < -1) {
                      tekst = `${Math.abs(a.dagen)} dagen geleden`;
                    } else if (a.dagen === 0) {
                      tekst = 'Vandaag';
                    } else if (a.dagen === 1) {
                      tekst = 'Morgen';
                    } else {
                      tekst = `Over ${a.dagen} dagen`;
                    }

                    return `${a.datum}<br><span class="waste-until">${tekst}</span>`;
                  ]]]
                custom_fields:
                  dots: |
                    [[[
                      const days = variables.afval.dagen;

                      const count =
                        days === null || days < 0
                          ? 0
