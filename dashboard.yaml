          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.screensaver
        hold_action:
          action: none
        double_tap_action:
          action: none
        styles:
          card:
            - position: fixed
            - inset: 0
            - width: auto
            - height: auto
            - min-width: 0
            - min-height: 0
            - max-width: none
            - max-height: none
            - box-sizing: border-box
            - padding: 0
            - margin: 0
            - border: none
            - border-radius: 0
            - box-shadow: none
            - overflow: hidden
            - scrollbar-width: none
