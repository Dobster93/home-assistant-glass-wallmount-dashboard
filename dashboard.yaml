      - type: conditional
        view_layout:
          grid-area: 1 / 1 / 2 / -1
        conditions:
          - condition: state
            entity: alarm_control_panel.alarmo
            state:
              - armed_home
              - armed_away
              - armed_night
              - armed_vacation
              - armed_custom_bypass
              - pending
              - triggered
        card:
          type: custom:mod-card
          card_mod:
            style: |
              :host {
                position: fixed;
                inset: 0;
                z-index: 10050;
                display: none;
                display: {{ 'flex' if states('alarm_control_panel.alarmo') in ['armed_home', 'armed_away', 'armed_night', 'armed_vacation', 'armed_custom_bypass', 'pending', 'triggered'] else 'none' }};
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
                padding: 16px;
                background: rgba(3, 8, 13, .72);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                pointer-events: auto;
                overscroll-behavior: contain;
              }
              ha-card {
                width: min(420px, 100%);
                max-height: calc(100dvh - 32px);
                overflow-y: auto;
                box-sizing: border-box;
                padding: 18px;
                border-radius: 28px;
                background: linear-gradient(155deg, rgba(27,35,40,.96), rgba(10,17,22,.98));
                border: 1px solid rgba(255,255,255,.13);
                box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 24px 70px rgba(0,0,0,.55);
                color: #edf3fa;
                --primary-text-color: #edf3fa;
                --secondary-text-color: rgba(205,215,228,.76);
                --primary-color: #3d9aff;
                --card-background-color: transparent;
                --ha-card-background: transparent;
                --ha-card-border-width: 0px;
                --control-button-background-color: rgba(255,255,255,.07);
                --control-button-border-radius: 16px;
              }
              @media (max-height: 600px) {
                :host { padding: 8px; }
                ha-card { padding: 10px; max-height: calc(100dvh - 16px); }
              }
          card:
            type: vertical-stack
            cards:
              - type: custom:button-card
                entity: alarm_control_panel.alarmo
                icon: mdi:shield-lock-outline
                show_state: false
                show_label: true
                name: |
                  [[[
                    if (entity?.state === 'triggered') return 'Alarm geactiveerd';
                    if (entity?.state === 'pending') return 'Schakel het alarm uit';
                    if (entity?.state === 'disarmed') return 'Alarm uitgeschakeld';
                    if (entity?.state?.startsWith('armed_')) return 'Alarm ingeschakeld';
                    return 'Alarmstatus onbekend';
                  ]]]
                label: Voer je pincode in en tik op Uitschakelen
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                styles:
                  card:
                    - background: transparent
                    - border: none
                    - box-shadow: none
                    - padding: 8px 4px 14px
                    - cursor: default
                  grid:
                    - grid-template-areas: '"i" "n" "l"'
                    - row-gap: 8px
                  icon:
                    - width: 42px
                    - color: |
                        [[[
                          return ['pending', 'triggered'].includes(entity?.state)
                            ? '#ff6b6b' : '#3d9aff';
                        ]]]
                  name:
                    - color: '#edf3fa'
                    - font-size: 22px
                    - font-weight: 600
                  label:
                    - color: rgba(205,215,228,.76)
                    - font-size: 13px
                    - white-space: normal
              - type: alarm-panel
                entity: alarm_control_panel.alarmo
                name: Woningbeveiliging
                states: []
                card_mod:
                  style: |
                    ha-card {
                      background: transparent !important;
                      border: none !important;
                      box-shadow: none !important;
                      color: #edf3fa;
                      --primary-text-color: #edf3fa;
                      --secondary-text-color: rgba(205,215,228,.76);
                      --mdc-text-field-fill-color: rgba(255,255,255,.07);
                      --mdc-text-field-ink-color: #edf3fa;
                      --mdc-text-field-label-ink-color: rgba(205,215,228,.76);
