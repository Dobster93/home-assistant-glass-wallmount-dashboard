          custom_fields:
            achtergrond:
              - position: absolute
              - inset: 0
              - width: 100%
              - height: 100%
              - min-width: 0
              - min-height: 0
              - overflow: hidden
              - scrollbar-width: none
              - -ms-overflow-style: none
              - z-index: 0
            informatie:
              - position: absolute
              - top: 50%
              - left: 50%
              - width: max-content
              - max-width: 68%
              - z-index: 10
              - color: white
              - text-align: center
              - animation: screensaver-float 90s ease-in-out infinite
              - will-change: transform
        custom_fields:
          achtergrond: |
            [[[
              const fotos = [
                'foto1.jpg',
                'foto2.jpg',
                'foto3.jpg',
                'foto4.jpg',
                'foto5.jpg',
                'foto6.jpg',
                'foto7.jpg',
                'foto8.jpg',
                'foto9.jpg',
                'foto10.jpg',
                'foto11.jpg',
                'foto12.jpg',
                'foto13.jpg',
                'foto14.jpg',
                'foto15.jpg',
                'foto16.jpg',
                'foto17.jpg',
                'foto18.jpg',
                'foto19.jpg'
              ];

              const fotoHtml = fotos.map((foto, index) => {
                const vertraging = index * 10;

                return `
                  <div
                    class="screensaver-slide"
                    style="animation-delay: ${vertraging}s;"
                  >
                    <img
                      class="screensaver-photo-blur"
                      src="/local/screensaver/${foto}"
                      aria-hidden="true"
                    >

                    <img
                      class="screensaver-photo-main"
                      src="/local/screensaver/${foto}"
                      alt="Screensaverfoto ${index + 1}"
                      loading="eager"
                      decoding="sync"
                      draggable="false"
                      onload="this.classList.add('is-loaded')"
                    >
                  </div>
                `;
              }).join('');

              return `
                <style>
                  * {
                    box-sizing: border-box;
                    scrollbar-width: none !important;
                    -ms-overflow-style: none !important;
                  }

                  *::-webkit-scrollbar {
                    display: none !important;
                    width: 0 !important;
                    height: 0 !important;
                  }

                  .screensaver-background {
                    position: absolute;
                    inset: 0;
                    width: 100%;
                    height: 100%;
                    min-width: 0;
                    min-height: 0;
                    overflow: hidden;
                    scrollbar-width: none;
                    -ms-overflow-style: none;
                    background: #000;
                  }

                  .screensaver-background::-webkit-scrollbar {
                    display: none;
                    width: 0;
                    height: 0;
                  }

                  .screensaver-slide {
                    position: absolute;
                    inset: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                    opacity: 0;
                    background: #000;
                    animation:
                      screensaver-slideshow 190s linear infinite;
                    will-change: opacity;
                  }

                  .screensaver-photo-blur {
                    position: absolute;
                    z-index: 1;
                    inset: -4%;
                    width: 108%;
                    height: 108%;
                    max-width: none;
                    max-height: none;
                    object-fit: cover;
                    object-position: center;
                    filter:
                      blur(28px)
                      brightness(0.48);
                    transform: scale(1.06);
                    animation:
                      screensaver-background-move
                      14s
                      ease-in-out
                      infinite
                      alternate;
                    will-change: transform;
                  }

                  .screensaver-photo-main {
                    position: absolute;
                    z-index: 2;
                    inset: 0;
                    display: block;
                    width: 100%;
                    height: 100%;
                    max-width: 100%;
                    max-height: 100%;
                    object-fit: contain;
                    object-position: center;
                    opacity: 0;
                    transition: opacity .65s ease-in-out;
                    backface-visibility: hidden;
                    transform: translateZ(0);
                  }

                  .screensaver-photo-main.is-loaded {
                    opacity: 1;
                  }

                  .screensaver-shade {
                    position: absolute;
                    inset: 0;
                    z-index: 3;
                    pointer-events: none;
                    background:
                      linear-gradient(
                        180deg,
                        rgba(0, 0, 0, 0.16) 0%,
                        rgba(0, 0, 0, 0.03) 42%,
                        rgba(0, 0, 0, 0.42) 100%
                      );
                  }

                  @keyframes screensaver-slideshow {
                    0% {
                      opacity: 0;
                    }

                    1% {
                      opacity: 1;
                    }

                    4.25% {
                      opacity: 1;
                    }

                    5.25% {
                      opacity: 0;
                    }

                    100% {
                      opacity: 0;
                    }
                  }

                  @keyframes screensaver-background-move {
                    0% {
                      transform:
                        scale(1.06)
                        translate3d(-0.5%, -0.5%, 0);
                    }

                    100% {
                      transform:
                        scale(1.10)
                        translate3d(0.5%, 0.5%, 0);
                    }
                  }

                  @keyframes screensaver-float {
                    0% {
                      transform:
                        translate3d(-50%, -50%, 0)
                        translate(-31vw, -15vh);
                    }

                    18% {
                      transform:
                        translate3d(-50%, -50%, 0)
                        translate(-33vw, 13vh);
                    }

                    38% {
                      transform:
                        translate3d(-50%, -50%, 0)
                        translate(-30vw, 3vh);
                    }

                    48% {
                      transform:
                        translate3d(-50%, -50%, 0)
                        translate(30vw, -3vh);
                    }

                    68% {
                      transform:
                        translate3d(-50%, -50%, 0)
                        translate(33vw, -13vh);
                    }

                    88% {
                      transform:
                        translate3d(-50%, -50%, 0)
                        translate(31vw, 14vh);
                    }

                    100% {
                      transform:
                        translate3d(-50%, -50%, 0)
                        translate(-31vw, -15vh);
                    }
                  }

                  @media (max-width: 1100px) {
                    @keyframes screensaver-float {
                      0% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-26vw, -14vh);
                      }

                      18% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-28vw, 12vh);
                      }

                      38% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-25vw, 3vh);
                      }

                      48% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(25vw, -3vh);
                      }

                      68% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(28vw, -12vh);
                      }

                      88% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(26vw, 13vh);
                      }

                      100% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-26vw, -14vh);
                      }
                    }
                  }

                  @media (max-width: 900px) {
                    @keyframes screensaver-float {
                      0% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-24vw, -13vh);
                      }

                      18% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-27vw, 11vh);
                      }

                      38% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-24vw, 2vh);
                      }

                      48% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(24vw, -2vh);
                      }

                      68% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(27vw, -11vh);
                      }

                      88% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(24vw, 12vh);
                      }

                      100% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-24vw, -13vh);
                      }
                    }
                  }

                  @media (max-width: 650px) {
                    @keyframes screensaver-float {
                      0% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-16vw, -11vh);
                      }

                      20% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-18vw, 9vh);
                      }

                      40% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-16vw, 2vh);
                      }

                      50% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(16vw, -2vh);
                      }

                      70% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(18vw, -9vh);
                      }

                      90% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(16vw, 10vh);
                      }

                      100% {
                        transform:
                          translate3d(-50%, -50%, 0)
                          translate(-16vw, -11vh);
                      }
                    }
                  }
                </style>

                <div class="screensaver-background">
                  ${fotoHtml}
                  <div class="screensaver-shade"></div>
                </div>
              `;
            ]]]
          informatie: |
            [[[
              const now = new Date();

              const time = now.toLocaleTimeString('nl-NL', {
                hour: '2-digit',
                minute: '2-digit'
              });

              const date = now.toLocaleDateString('nl-NL', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric'
              });

              const weatherEntity =
                states['weather.forecast_thuis'];

              const temperature =
                weatherEntity?.attributes?.temperature ?? '--';

              const translations = {
                'clear-night': 'Heldere nacht',
                'cloudy': 'Bewolkt',
                'exceptional': 'Uitzonderlijk weer',
                'fog': 'Mist',
                'hail': 'Hagel',
                'lightning': 'Onweer',
                'lightning-rainy': 'Onweer met regen',
                'partlycloudy': 'Gedeeltelijk bewolkt',
                'pouring': 'Zware regen',
                'rainy': 'Regen',
                'snowy': 'Sneeuw',
                'snowy-rainy': 'Natte sneeuw',
                'sunny': 'Zonnig',
                'windy': 'Winderig',
                'windy-variant': 'Winderig en bewolkt'
              };

              const condition = weatherEntity
                ? translations[weatherEntity.state]
                  ?? weatherEntity.state
                : 'Weergegevens niet beschikbaar';

              const weatherIcons = {
                'clear-night': 'mdi:weather-night',
                'cloudy': 'mdi:weather-cloudy',
                'exceptional': 'mdi:alert-circle-outline',
                'fog': 'mdi:weather-fog',
                'hail': 'mdi:weather-hail',
                'lightning': 'mdi:weather-lightning',
                'lightning-rainy':
                  'mdi:weather-lightning-rainy',
                'partlycloudy':
                  'mdi:weather-partly-cloudy',
                'pouring': 'mdi:weather-pouring',
                'rainy': 'mdi:weather-rainy',
                'snowy': 'mdi:weather-snowy',
                'snowy-rainy':
                  'mdi:weather-snowy-rainy',
                'sunny': 'mdi:weather-sunny',
                'windy': 'mdi:weather-windy',
                'windy-variant':
                  'mdi:weather-windy-variant'
              };

              const weatherIcon =
                weatherIcons[weatherEntity?.state]
                ?? 'mdi:weather-partly-cloudy';

              return `
                <style>
                  * {
                    scrollbar-width: none !important;
                    -ms-overflow-style: none !important;
                  }

                  *::-webkit-scrollbar {
                    display: none !important;
                    width: 0 !important;
                    height: 0 !important;
                  }

                  .screensaver-information {
                    width: max-content;
                    max-width: min(520px, 58vw);
                    padding: 20px 28px;
                    overflow: hidden;
                    scrollbar-width: none;
                    -ms-overflow-style: none;

                    border:
                      1px solid
                      rgba(255, 255, 255, 0.20);

                    border-radius: 24px;

                    background:
                      rgba(5, 12, 22, 0.30);

                    box-shadow:
                      0 15px 50px rgba(0, 0, 0, 0.32),
                      inset 0 1px 0
                      rgba(255, 255, 255, 0.14);

                    backdrop-filter: blur(13px);
                    -webkit-backdrop-filter: blur(13px);

                    text-shadow:
                      0 3px 18px
                      rgba(0, 0, 0, 0.70);
                  }

                  .screensaver-information::-webkit-scrollbar {
                    display: none;
                    width: 0;
                    height: 0;
                  }

                  .screensaver-time {
                    font-size:
                      clamp(54px, 8vw, 115px);

                    line-height: 0.90;
                    font-weight: 300;
                    letter-spacing: -5px;
                    white-space: nowrap;
                  }

                  .screensaver-date {
                    margin-top: 15px;

                    font-size:
                      clamp(16px, 1.7vw, 26px);

                    font-weight: 400;
                    text-transform: capitalize;
                    white-space: nowrap;
                    opacity: 0.94;
                  }

                  .screensaver-weather {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    flex-wrap: wrap;
                    gap: 8px;

                    margin-top: 18px;

                    font-size:
                      clamp(15px, 1.5vw, 23px);
                  }

                  .screensaver-weather ha-icon {
                    width: 27px;
                    height: 27px;
                  }

                  .screensaver-separator {
                    opacity: 0.55;
                  }

                  .screensaver-hint {
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    gap: 6px;

                    margin-top: 15px;

                    font-size:
                      clamp(10px, 0.9vw, 14px);

                    opacity: 0.55;
                  }

                  .screensaver-hint ha-icon {
                    width: 16px;
                    height: 16px;
                  }

                  @media (max-width: 900px) {
                    .screensaver-information {
                      max-width: 54vw;
                      padding: 17px 22px;
                      border-radius: 20px;
                    }

                    .screensaver-time {
                      font-size:
                        clamp(46px, 7vw, 88px);

                      letter-spacing: -4px;
                    }

                    .screensaver-date {
                      white-space: normal;
                    }

                    .screensaver-weather {
                      gap: 6px;
                    }
                  }

                  @media (max-width: 650px) {
                    .screensaver-information {
                      max-width: 64vw;
                      padding: 15px 18px;
                      border-radius: 18px;
                    }

                    .screensaver-time {
                      font-size:
                        clamp(40px, 10vw, 70px);

                      letter-spacing: -3px;
                    }

                    .screensaver-date {
                      margin-top: 12px;

                      font-size:
                        clamp(14px, 3.2vw, 20px);
                    }

                    .screensaver-weather {
                      margin-top: 14px;

                      font-size:
                        clamp(13px, 3vw, 18px);
                    }

                    .screensaver-weather ha-icon {
                      width: 22px;
                      height: 22px;
                    }

                    .screensaver-hint {
                      margin-top: 12px;
                    }
                  }
                </style>

                <div class="screensaver-information">
                  <div class="screensaver-time">
                    ${time}
                  </div>

                  <div class="screensaver-date">
                    ${date}
                  </div>

                  <div class="screensaver-weather">
                    <ha-icon
                      icon="${weatherIcon}">
                    </ha-icon>

                    <span>
                      ${temperature} °C
                    </span>

                    <span class="screensaver-separator">
                      •
                    </span>

                    <span>
                      ${condition}
                    </span>
                  </div>

                  <div class="screensaver-hint">
                    <ha-icon
                      icon="mdi:gesture-tap">
                    </ha-icon>

                    <span>
                      Tik om de screensaver te sluiten
                    </span>
                  </div>
                </div>
              `;
            ]]]
